<!DOCTYPE html>
<!-- Stockroom: inventory control for small offices. Author: Leroy George <georgeleroy.1997@gmail.com>. MIT License, see LICENSE -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockroom — Inventory Control</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">◧</div>
      <div class="brand-text">
        <div class="brand-name">Stockroom</div>
        <div class="brand-sub">Inventory Control</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-ico">▤</span> Dashboard
      </button>
      <button class="nav-item" data-view="scan">
        <span class="nav-ico">▥</span> Scan &amp; Lookup
      </button>
      <button class="nav-item" data-view="transactions">
        <span class="nav-ico">≡</span> Transaction Log
      </button>
    </nav>

    <div class="nav-section-label">Product Types</div>
    <nav class="nav" id="category-nav"></nav>
    <button class="nav-add" id="btn-add-category-nav">+ New product type</button>

    <div class="sidebar-footer">
      <button class="nav-item" data-view="settings">
        <span class="nav-ico">⚙</span> Manage product types
      </button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div id="topbar-title">Dashboard</div>
      <div class="scan-hint">Scanner ready — click "Scan &amp; Lookup" then scan any barcode</div>
    </header>

    <section id="view-root" class="view-root"></section>
  </main>
</div>

<!-- ===================== Templates ===================== -->

<template id="tpl-dashboard">
  <div class="cards-row">
    <div class="stat-card">
      <div class="stat-label">Products</div>
      <div class="stat-value" id="stat-products">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Units in stock</div>
      <div class="stat-value" id="stat-units">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Stock value (cost)</div>
      <div class="stat-value" id="stat-value">–</div>
    </div>
    <div class="stat-card warn">
      <div class="stat-label">Low stock items</div>
      <div class="stat-value" id="stat-low">–</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">Low stock alerts</div>
    <table class="table" id="low-stock-table">
      <thead><tr><th>Barcode</th><th>Product</th><th>Qty left</th><th>Threshold</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</template>

<template id="tpl-scan">
  <div class="panel scan-panel">
    <div class="panel-head">Scan or type a barcode</div>
    <input type="text" id="scan-input" class="scan-input" placeholder="Waiting for scan…" autocomplete="off">
    <div id="scan-result"></div>
  </div>
</template>

<template id="tpl-transactions">
  <div class="panel">
    <div class="panel-head">Recent transactions</div>
    <table class="table">
      <thead><tr><th>Date</th><th>Type</th><th>Product</th><th>Barcode</th><th>Qty</th><th>Unit price</th><th>Party</th><th>Note</th></tr></thead>
      <tbody id="transactions-body"></tbody>
    </table>
  </div>
</template>

<template id="tpl-category">
  <div class="panel-head-row">
    <div class="panel-head" id="cat-view-title">Products</div>
    <div class="head-actions">
      <input type="text" id="cat-search" class="search-input" placeholder="Search by name or barcode…">
      <button class="btn primary" id="btn-add-product">+ Add product</button>
    </div>
  </div>
  <table class="table">
    <thead><tr><th>Barcode</th><th>Name</th><th>Qty</th><th>Cost</th><th>Sell</th><th></th></tr></thead>
    <tbody id="cat-products-body"></tbody>
  </table>
</template>

<template id="tpl-settings">
  <div class="panel-head-row">
    <div class="panel-head">Product types</div>
    <button class="btn primary" id="btn-new-category">+ New product type</button>
  </div>
  <table class="table">
    <thead><tr><th>Name</th><th>Barcode prefix</th><th>Custom fields</th><th></th></tr></thead>
    <tbody id="settings-cat-body"></tbody>
  </table>
</template>

<!-- ===================== Modals ===================== -->

<div class="modal-backdrop" id="modal-backdrop"></div>

<div class="modal" id="modal-category">
  <h3 id="cat-modal-title">New product type</h3>
  <label>Name<input type="text" id="cat-name"></label>
  <label>Barcode prefix (e.g. ELEC)<input type="text" id="cat-prefix" maxlength="10"></label>
  <div class="fields-editor">
    <div class="fields-editor-head">Custom fields for this product type</div>
    <div id="cat-fields-list"></div>
    <button class="btn ghost small" id="btn-add-field">+ Add field</button>
  </div>
  <div class="modal-actions">
    <button class="btn ghost" id="cat-cancel">Cancel</button>
    <button class="btn primary" id="cat-save">Save</button>
  </div>
</div>

<div class="modal wide" id="modal-product">
  <h3 id="prod-modal-title">Add product</h3>
  <div class="form-grid">
    <label>Name<input type="text" id="prod-name"></label>
    <label>Barcode <span class="hint">(leave blank to auto-generate)</span><input type="text" id="prod-barcode"></label>
    <label>Cost price<input type="number" step="0.01" id="prod-cost"></label>
    <label>Sell price<input type="number" step="0.01" id="prod-sell"></label>
    <label>Opening quantity<input type="number" id="prod-qty"></label>
    <label>Low stock threshold<input type="number" id="prod-threshold"></label>
  </div>
  <div id="prod-extra-fields" class="form-grid"></div>
  <div class="modal-actions">
    <button class="btn ghost" id="prod-cancel">Cancel</button>
    <button class="btn primary" id="prod-save">Save product</button>
  </div>
</div>

<div class="modal" id="modal-txn">
  <h3 id="txn-modal-title">Purchase / Sale</h3>
  <div class="txn-product-name" id="txn-product-name"></div>
  <div class="txn-type-toggle">
    <button class="toggle-btn active" data-type="purchase">Purchase (stock in)</button>
    <button class="toggle-btn" data-type="sale">Sale (stock out)</button>
  </div>
  <label>Quantity<input type="number" id="txn-qty" min="1" value="1"></label>
  <label>Unit price<input type="number" step="0.01" id="txn-price"></label>
  <label>Party (supplier / customer)<input type="text" id="txn-party"></label>
  <label>Note<input type="text" id="txn-note"></label>
  <div class="modal-actions">
    <button class="btn ghost" id="txn-cancel">Cancel</button>
    <button class="btn primary" id="txn-save">Confirm</button>
  </div>
</div>

<div class="modal wide" id="modal-label">
  <h3>Print label</h3>
  <label>Label size
    <select id="label-size">
      <option value="89x28">Dymo 30252 — 89 × 28 mm (Address)</option>
      <option value="57x32">Dymo 30334 — 57 × 32 mm (Multipurpose)</option>
      <option value="102x59">Dymo 99012 — 102 × 59 mm (Large)</option>
      <option value="25x25">Dymo 30333 — 25 × 25 mm (Small square)</option>
    </select>
  </label>
  <div class="label-preview-wrap">
    <div id="label-preview" class="label-preview"></div>
  </div>
  <div class="modal-actions">
    <button class="btn ghost" id="label-cancel">Cancel</button>
    <button class="btn primary" id="label-print">Print</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
